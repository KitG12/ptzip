name: Desktop release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, flag: --mac }
          - { os: windows-latest, flag: --win }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-package-lock --ignore-scripts electron@33.2.0 electron-builder@25
      - run: npx electron-builder --config electron-builder.yml ${{ matrix.flag }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: ptzIP-${{ matrix.os }}
          path: |
            electron-release/ptzIP-mac.dmg
            electron-release/ptzIP-win.exe
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ptzIP ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          draft: false
          files: |
            electron-release/ptzIP-mac.dmg
            electron-release/ptzIP-win.exe
