appId: app.ptzip.desktop
productName: ptzIP
electronVersion: 33.2.0
directories: { output: electron-release, buildResources: build }
files: [electron/**, public/downloads/ptzip-helper.cjs, package.json]
extraMetadata: { main: electron/main.cjs }
mac:
  target: [{ target: dmg, arch: [universal] }]
  icon: build/icon.png
  category: public.app-category.utilities
  artifactName: ptzIP-mac.${ext}
  extendInfo:
    NSLocalNetworkUsageDescription: ptzIP scans your local network to discover production cameras.
    NSBonjourServices: [_http._tcp]
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: build/icon.png
  artifactName: ptzIP-win.${ext}
nsis: { oneClick: false, allowToChangeInstallationDirectory: true }
publish: null
